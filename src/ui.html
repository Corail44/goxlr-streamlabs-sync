<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/icon.ico">
<title>goxlr-streamlabs-sync</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1114; --panel: #15181c; --panel2: #0b0d10; --line: #242930;
    --text: #d6dde4; --dim: #76828e; --led: #34d97b; --red: #ff5252; --amber: #ffb454;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }

  /* Top bar */
  #topbar { display: flex; align-items: center; gap: 18px; padding: 12px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #wordmark { font-size: 13px; font-weight: 700; letter-spacing: 2px; }
  #wordmark .sep { color: var(--led); padding: 0 4px; }
  #wordmark .v { color: var(--dim); font-weight: 400; letter-spacing: 0; margin-left: 8px; font-family: Consolas, monospace; font-size: 12px; }
  .status { display: flex; gap: 14px; flex: 1; flex-wrap: wrap; align-items: center; }
  .st { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); }
  .st b { color: var(--text); font-weight: 600; }
  .st::before { content: "\25CF"; margin-right: 6px; color: var(--dim); }
  .st.on::before { color: var(--led); }
  .st.off::before { color: var(--red); }
  .badge-mini { display: none; font-size: 10px; letter-spacing: 1.5px; padding: 3px 10px; border-radius: 3px; }
  #st-submix { border: 1px solid var(--amber); color: var(--amber); }
  #st-live { background: var(--red); color: #fff; font-weight: 700; }
  #st-rec { border: 1px solid var(--red); color: var(--red); }
  .tb { display: flex; gap: 8px; align-items: center; }
  .tb-btn, #lang { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 4px;
                   padding: 6px 12px; cursor: pointer; font: 11px "Segoe UI", sans-serif; letter-spacing: 1px; text-transform: uppercase; }
  .tb-btn:hover, #lang:hover { border-color: var(--dim); }
  #btn-settings { color: var(--led); border-color: #1f5237; }
  #btn-settings:hover { background: #14301f; border-color: var(--led); }
  #quit { color: var(--red); border-color: #5a2727; }
  #quit:hover { background: #3a1515; border-color: var(--red); }
  #lang { text-transform: none; }

  /* Update banner */
  #update { display: none; margin: 12px 18px 0; padding: 9px 14px; border-radius: 4px;
            background: #2b2113; border: 1px solid var(--amber); font-size: 13px; }
  #update a { color: var(--amber); font-weight: 600; }

  /* Onboarding */
  #onboarding { display: none; margin: 14px 18px 0; padding: 14px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
  #onboarding h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--led); }
  #onboarding ol { margin: 0; padding-left: 20px; color: var(--dim); }
  #onboarding li { margin: 4px 0; }
  #onboarding a { color: var(--led); }

  /* Mixer strips */
  #console { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 18px; }
  .strip { width: 104px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
           padding: 10px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .s-name { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; }
  .s-track { height: 132px; width: 16px; background: var(--panel2); border: 1px solid var(--line); border-radius: 3px;
             position: relative; overflow: hidden; cursor: ns-resize; touch-action: none; }
  .s-track:hover { border-color: var(--dim); }
  .s-track i { position: absolute; bottom: 0; left: 0; right: 0; background: var(--led);
               box-shadow: 0 -2px 0 0 #e8eef4; transition: height .12s ease; }
  .strip.muted .s-track i { background: var(--red); }
  .s-val { font: 600 15px Consolas, monospace; }
  .s-val small { color: var(--dim); font-weight: 400; }
  .s-mute { font-size: 9px; letter-spacing: 1.5px; padding: 2px 9px; border-radius: 3px;
            border: 1px solid var(--line); color: var(--dim); cursor: pointer; user-select: none;
            background: transparent; font-family: inherit; }
  .s-mute:hover { border-color: var(--red); color: var(--red); }
  .strip.muted .s-mute { background: var(--red); border-color: var(--red); color: #fff; }
  .s-src { font-size: 10px; color: var(--dim); text-align: center; word-break: break-word; line-height: 1.3; }
  .s-src .bad { color: var(--red); text-decoration: line-through; }

  /* Collapsible sections */
  details { margin: 4px 18px 16px; }
  summary { cursor: pointer; user-select: none; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
            font-weight: 600; color: var(--text); background: var(--panel); border: 1px solid var(--line);
            border-radius: 4px; padding: 10px 14px; }
  summary:hover { border-color: var(--dim); }
  details[open] > summary { border-radius: 4px 4px 0 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-top: none; border-radius: 0 0 4px 4px; padding: 14px 16px; }

  /* Settings */
  .set-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
  .set-row > label { min-width: 190px; color: var(--dim); font-size: 13px; }
  select, input[type=text], input[type=password] { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 7px 10px; font: 13px "Segoe UI", sans-serif; }
  select:focus, input:focus { outline: none; border-color: var(--led); }
  select option { background: var(--panel2); color: var(--text); }
  input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--led); }
  .map-row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .map-row select { width: 140px; }
  .map-row input { flex: 1; min-width: 160px; }
  .x { background: transparent; border: 1px solid var(--line); color: var(--dim); border-radius: 4px; padding: 6px 10px; cursor: pointer; font: 12px "Segoe UI", sans-serif; }
  .x:hover { border-color: var(--red); color: var(--red); }
  .x.ok:hover { border-color: var(--led); color: var(--led); }
  .btn { background: #1f5237; border: 1px solid var(--led); color: var(--led); border-radius: 4px;
         padding: 8px 18px; cursor: pointer; font: 600 12px "Segoe UI", sans-serif; letter-spacing: 1px; text-transform: uppercase; }
  .btn:hover { background: var(--led); color: #0b0d10; }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--text); }
  .btn.ghost:hover { border-color: var(--led); color: var(--led); }
  #save-status { margin-left: 10px; font-size: 13px; }
  .small { color: var(--dim); font-size: 12px; margin-top: 8px; word-break: break-all; }
  .small a { color: var(--led); }
  .qr-box { display: inline-block; background: #fff; padding: 10px; border-radius: 4px; line-height: 0; }
  .qr-box svg { display: block; }

  /* Logs */
  #logs { background: var(--panel2); border: 1px solid var(--line); border-top: none; border-radius: 0 0 4px 4px;
          padding: 10px 12px; max-height: 320px; overflow-y: auto;
          font: 12px/1.55 Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
  .lg-info { color: #8da3b5; } .lg-ok { color: var(--led); } .lg-warn { color: var(--amber); } .lg-error { color: var(--red); } .lg-debug { color: #57626d; }

  /* Mix / FX / sampler chip bars */
  #mixbar, #fxbar, #samplerbar { display: none; flex-wrap: wrap; gap: 8px; padding: 0 18px 4px; align-items: center; }
  .bar-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); margin-right: 4px; }
  .mix-chip.fx-on { background: #1f5237; border-color: var(--led); color: var(--led); }
  .mix-chip.fx-active { border-color: var(--amber); color: var(--amber); }
  .mix-chip.playing { background: var(--red); border-color: var(--red); color: #fff; }
  .mix-chip { display: inline-flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line);
              border-radius: 4px; padding: 7px 12px; cursor: pointer; font: 600 12px "Segoe UI", sans-serif; color: var(--text); user-select: none; }
  .mix-chip:hover { border-color: var(--led); color: var(--led); }
  .mix-chip .del { color: var(--dim); font-size: 11px; padding: 0 2px; }
  .mix-chip .del:hover { color: var(--red); }
  .mix-chip .edit { color: var(--dim); font-size: 13px; padding: 0 2px; line-height: 0; }
  .mix-chip .edit:hover { color: var(--amber); }
  #mix-editor { display: none; margin: 0 18px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; }
  #mix-editor .me-head { font-weight: 600; margin-bottom: 8px; }
  .me-row { display: flex; align-items: center; gap: 12px; margin: 5px 0; }
  .me-row .ch { min-width: 90px; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
  input[type=number] { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font: 13px "Segoe UI", sans-serif; width: 80px; }
  input[type=number]:focus { outline: none; border-color: var(--led); }
  .mix-chip.add { color: var(--dim); font-weight: 400; }
  .mix-chip.add:hover { border-color: var(--led); color: var(--led); }

  .rule-row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .rule-row input { width: 200px; }
  .rule-row select { width: 160px; }

  /* PIN gate */
  #pin-gate { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; }
  #pin-gate.show { display: flex; }
  #pin-gate .box { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 28px 32px; text-align: center; }
  #pin-gate input { font: 600 22px Consolas, monospace; letter-spacing: 6px; text-align: center; width: 190px; margin: 14px 0; }
  #pin-gate .err { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 8px; }

  footer { padding: 0 18px 18px; color: var(--dim); font-size: 12px; }
  #overlay { position: fixed; inset: 0; background: rgba(8, 10, 12, .88); display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  #overlay.show { display: flex; }
  #overlay .box { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 26px 32px; font-size: 15px; }

  /* Phone layout */
  @media (max-width: 640px) {
    #topbar { gap: 10px; padding: 10px 12px; }
    #wordmark .v { display: none; }
    #console { padding: 12px 10px; gap: 8px; }
    .strip { width: calc(33.33% - 6px); }
    .s-track { width: 26px; height: 150px; }
    details { margin: 4px 10px 12px; }
    .set-row > label { min-width: 100%; }
    .map-row select { width: 110px; }
    .map-row input { min-width: 120px; }
  }
</style>
</head>
<body>
<div id="topbar">
  <div id="wordmark">GOXLR<span class="sep">/</span>STREAMLABS<span class="v">sync v__VERSION__</span></div>
  <div class="status">
    <span class="st" id="st-goxlr">GoXLR</span>
    <span class="st" id="st-slobs">Streamlabs</span>
    <span class="badge-mini" id="st-live"></span>
    <span class="badge-mini" id="st-rec">REC</span>
    <span class="badge-mini" id="st-submix">MIX B</span>
  </div>
  <div class="tb">
    <select id="lang" title="Language">
      <option value="auto">Auto</option>
      <option value="fr">Français</option>
      <option value="en">English</option>
    </select>
    <button class="tb-btn" id="btn-settings"></button>
    <button class="tb-btn" id="quit"></button>
  </div>
</div>

<div id="update"></div>
<div id="onboarding"></div>
<main id="console"></main>
<div id="mixbar"></div>
<div id="fxbar"></div>
<div id="samplerbar"></div>
<div id="mix-editor">
  <div class="me-head" id="me-title"></div>
  <div id="me-rows"></div>
  <div class="set-row" style="margin-top:10px">
    <button class="btn" id="me-save"></button>
    <button class="btn ghost" id="me-close"></button>
    <span id="me-status" class="small" style="margin-top:0"></span>
  </div>
</div>

<details id="settings-wrap">
  <summary id="settings-title"></summary>
  <div class="panel">
    <div class="set-row">
      <label id="lb-autostart"></label>
      <input type="checkbox" id="autostart">
      <span class="small" id="autostart-info" style="margin-top:0"></span>
    </div>
    <div class="set-row">
      <label id="lb-notif"></label>
      <input type="checkbox" id="notif">
      <span class="small" id="notif-hint" style="margin-top:0"></span>
    </div>
    <div class="set-row">
      <label id="lb-twoway"></label>
      <input type="checkbox" id="twoway">
      <span class="small" id="twoway-hint" style="margin-top:0"></span>
    </div>
    <div class="set-row">
      <label id="lb-lan"></label>
      <input type="checkbox" id="lan">
      <span class="small" id="lan-urls" style="margin-top:0"></span>
    </div>
    <div class="set-row" id="lan-qr-row" style="display:none">
      <label></label>
      <div>
        <div class="qr-box" id="lan-qr"></div>
        <div class="small" id="lan-qr-url"></div>
      </div>
    </div>
    <div class="set-row">
      <label id="lb-mutemode"></label>
      <select id="mutemode"></select>
    </div>
    <div class="set-row">
      <label id="lb-slobs-conn"></label>
      <input type="text" id="slobs-host" style="width:170px" spellcheck="false">
      <span style="color:var(--dim)">:</span>
      <input type="text" id="slobs-port" style="width:80px" inputmode="numeric" spellcheck="false">
    </div>
    <div class="set-row">
      <label id="lb-token"></label>
      <input type="password" id="token" style="min-width:280px" autocomplete="off">
      <button class="x ok" id="token-test"></button>
      <span class="small" id="token-result" style="margin-top:0"></span>
    </div>
    <div class="set-row" style="margin-top:-4px">
      <label></label>
      <span class="small" id="token-hint" style="margin-top:0"></span>
    </div>
    <div class="set-row" style="align-items:flex-start">
      <label id="lb-mappings"></label>
      <div style="flex:1">
        <div class="small" id="profile-info" style="margin:0 0 6px"></div>
        <div id="map-rows"></div>
        <button class="x" id="map-add" style="margin-top:6px">+ <span id="lb-add"></span></button>
      </div>
    </div>
    <div class="set-row">
      <label></label>
      <button class="btn" id="save"></button>
      <button class="btn ghost" id="save-profile" style="display:none"></button>
      <button class="x" id="del-profile" style="display:none"></button>
      <span id="save-status"></span>
    </div>
    <div class="set-row">
      <label id="lb-pin"></label>
      <input type="password" id="pin" style="width:140px" inputmode="numeric" autocomplete="off">
      <span class="small" id="pin-hint" style="margin-top:0"></span>
    </div>
    <div class="set-row" style="align-items:flex-start">
      <label id="lb-rules"></label>
      <div style="flex:1">
        <div class="small" id="rules-hint" style="margin:0 0 6px"></div>
        <div id="rule-rows"></div>
        <button class="x" id="rule-add" style="margin-top:6px">+ <span id="lb-rule-add"></span></button>
      </div>
    </div>
    <div class="set-row">
      <label id="lb-diag"></label>
      <button class="x ok" id="diag-copy"></button>
      <span class="small" id="diag-status" style="margin-top:0"></span>
    </div>
    <div class="small" id="cfg-path"></div>
  </div>
</details>

<details open>
  <summary id="log-title"></summary>
  <div id="logs"></div>
</details>
<footer id="hint"></footer>
<div id="overlay"><div class="box" id="overlay-msg"></div></div>
<div id="pin-gate"><div class="box">
  <div id="pin-title" style="font-weight:600"></div>
  <input type="password" id="pin-input" inputmode="numeric" maxlength="8" autocomplete="off">
  <div><button class="btn" id="pin-go"></button></div>
  <div class="err" id="pin-err"></div>
</div></div>
<datalist id="sources-list"></datalist>
<datalist id="scenes-list"></datalist>

</script>

      profileActive: (n) => `Active GoXLR profile: ${n}`,
      profileDedicated: 'dedicated mapping set',
      profileDefault: 'default mappings',
      saveForProfile: (n) => `Save for "${n}"`,
      delForProfile: (n) => `Delete the "${n}" set`,
      profileHint: 'A dedicated set applies automatically whenever this profile is loaded on the GoXLR.',
      save: 'Save',
      saved: 'Saved and applied',
      mixes: 'Mixes',
      mixAdd: 'Save current mix',
      mixName: 'Mix name (current volumes and mutes):',
      mixDelete: (n) => `Delete the mix "${n}"?`,
      mixEditTip: 'Edit the mix values',
      mixEditTitle: (n) => `Editing mix "${n}"`,
      mixInclude: 'Included in the mix',
      close: 'Close',
      pin: 'Network access PIN',
      pinSet: 'Configured. Empty keeps it, OFF removes it.',
      pinUnset: '4 to 8 digits (optional). Protects network access.',
      pinTitle: 'Access code',
      pinGo: 'Enter',
      pinBad: 'Wrong PIN',
      rules: 'Scene automation',
      rulesHint: 'When Streamlabs switches to this scene, the chosen mix is applied with a fade.',
      ruleAdd: 'Add a rule',
      scenePh: 'Streamlabs scene...',
      diag: 'Support',
      diagCopy: 'Copy diagnostic',
      diagCopied: 'Copied! Paste it into a GitHub issue.',
      cfgFile: 'Config file: ',
      updateAvailable: (v) => `New version v${v} available.`,
      download: 'Download',
      onbTitle: 'Getting started',
      onbSteps: [
        'In Streamlabs, add an "Audio Output Capture" source for each GoXLR device you want (Game, Music, Chat, System) and an "Audio Input Capture" on Chat Mic.',
        'Open the Settings and map each GoXLR channel to your Streamlabs source (the list suggests your live sources).',
        'Save, then move a fader on the GoXLR: the Streamlabs slider should follow.',
        'For separated tracks in recordings: Streamlabs Settings, Output (Advanced), MKV/MP4 format and 6 audio tracks.',
      ],
      onbDoc: 'Full guide: ',
    },
  };

  // Language: 'auto' follows the browser; can be forced and is remembered per browser.
  const storedLang = localStorage.getItem('gss-lang') || 'auto';
  const effectiveLang = storedLang === 'auto' ? (navigator.language || 'en').slice(0, 2) : storedLang;
  const T = LANGS[effectiveLang] || LANGS.en;

  const $ = (s) => document.querySelector(s);
  $('#lang').value = storedLang;
  $('#lang').addEventListener('change', (e) => {
    localStorage.setItem('gss-lang', e.target.value);
    location.reload();
  });

  $('#quit').textContent = T.quit;
  $('#log-title').textContent = T.logs;
  $('#hint').textContent = T.hint;
  $('#settings-title').textContent = T.settings;
  $('#btn-settings').textContent = T.settings;
  $('#lb-autostart').textContent = T.autostart;
  $('#lb-notif').textContent = T.notif;
  $('#notif-hint').textContent = T.notifHint;
  $('#lb-mutemode').textContent = T.muteMode;
  $('#lb-token').textContent = T.token;
  $('#lb-slobs-conn').textContent = T.slobsConn;
  $('#token-test').textContent = T.tokenTest;
  $('#token-hint').textContent = T.tokenHint;
  $('#lb-mappings').textContent = T.mappings;
  $('#lb-add').textContent = T.add;
  $('#save').textContent = T.save;
  $('#lb-twoway').textContent = T.twoWay;
  $('#twoway-hint').textContent = T.twoWayHint;
  $('#lb-lan').textContent = T.lan;
  $('#st-submix').title = T.submixTitle;
  $('#st-live').textContent = T.liveBadge;
  $('#lb-diag').textContent = T.diag;
  $('#diag-copy').textContent = T.diagCopy;
  $('#lb-pin').textContent = T.pin;
  $('#lb-rules').textContent = T.rules;
  $('#rules-hint').textContent = T.rulesHint;
  $('#lb-rule-add').textContent = T.ruleAdd;
  $('#pin-title').textContent = T.pinTitle;
  $('#pin-go').textContent = T.pinGo;
  $('#me-save').textContent = T.save;
  $('#me-close').textContent = T.close;

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hhmmss = (t) => new Date(t).toTimeString().slice(0, 8);

  let quitRequested = false;
  let logsInit = false;
  let settingsInit = false;
  let channelsList = [];
  let lastState = null;

  function setStatus(el, label, on, detail) {
    el.className = 'st ' + (on ? 'on' : 'off');
    el.innerHTML = `${esc(label)} <b>${esc(detail)}</b>`;
  }

  function renderState(s) {
    lastState = s;
    setStatus($('#st-goxlr'), 'GoXLR', s.goxlr.connected,
      s.goxlr.connected ? (s.goxlr.device ?? T.connected) : T.disconnected);
    setStatus($('#st-slobs'), 'Streamlabs', s.streamlabs.connected,
      s.streamlabs.connected ? `${T.via} ${s.streamlabs.mode}` : T.disconnected);
    $('#st-live').style.display = s.live?.streaming === 'live' ? 'inline-block' : 'none';
    $('#st-rec').style.display = s.live?.recording === 'recording' ? 'inline-block' : 'none';
    $('#st-submix').style.display = s.submixActive ? 'inline-block' : 'none';

    if (s.update && s.update.available) {
      $('#update').style.display = 'block';
      $('#update').innerHTML = `${esc(T.updateAvailable(s.update.latest))} <a href="${esc(s.update.url)}" target="_blank" rel="noopener">${esc(T.download)}</a>`;
    }

    if (!dragging) {
      $('#console').innerHTML = s.channels.map((c) => {
        const pct = c.volume == null ? 0 : Math.round(c.volume / 255 * 100);
        return `
        <div class="strip${c.muted ? ' muted' : ''}" data-channel="${esc(c.channel)}" data-muted="${c.muted ? 1 : 0}">
          <div class="s-name">${esc(c.channel)}</div>
          <div class="s-track"><i style="height:${pct}%"></i></div>
          <div class="s-val">${c.volume == null ? '--' : pct}<small>%</small></div>
          <button class="s-mute" title="${esc(T.muteTitle)}">${T.muted}</button>
          <div class="s-src">${c.sources.map((x) => `<span class="${x.resolved ? '' : 'bad'}">${esc(x.name)}</span>`).join('<br>')}</div>
        </div>`;
      }).join('');
    }

    const mb = $('#mixbar');
    mb.style.display = s.channels.length ? 'flex' : 'none';
    mb.innerHTML = `<span class="bar-label">${esc(T.mixes)}</span>` +
      (s.snapshots || []).map((n) => `<span class="mix-chip" data-mix="${esc(n)}">${esc(n)}<span class="edit" title="${esc(T.mixEditTip)}">&#8230;</span><span class="del" title="${esc(T.mixDelete(n))}">&#215;</span></span>`).join('') +
      `<span class="mix-chip add" id="mix-add">+ ${esc(T.mixAdd)}</span>`;

    // Voice FX bar (GoXLR Full)
    const fx = s.fx;
    const fb = $('#fxbar');
    if (fx && fx.names && Object.keys(fx.names).length) {
      fb.style.display = 'flex';
      const order = ['Preset1', 'Preset2', 'Preset3', 'Preset4', 'Preset5', 'Preset6'];
      fb.innerHTML = `<span class="bar-label">FX</span>
        <span class="mix-chip${fx.enabled ? ' fx-on' : ''}" id="fx-toggle">${fx.enabled ? 'ON' : 'OFF'}</span>` +
        order.filter((k) => fx.names[k]).map((k) =>
          `<span class="mix-chip fx-preset${fx.active === k ? ' fx-active' : ''}" data-preset="${k}">${esc(fx.names[k])}</span>`).join('');
    } else {
      fb.style.display = 'none';
    }

    // Sampler pads (only buttons that hold samples)
    const sp = s.sampler ?? {};
    const sb = $('#samplerbar');
    const pads = [];
    for (const bank of ['A', 'B', 'C']) {
      for (const [btn, d] of Object.entries(sp[bank] ?? {})) pads.push({ bank, btn, ...d });
    }
    if (pads.length) {
      sb.style.display = 'flex';
      sb.innerHTML = `<span class="bar-label">Sampler</span>` + pads.map((p) => {
        const label = p.name.length > 18 ? p.name.slice(0, 17) + '~' : p.name;
        return `<span class="mix-chip pad${p.playing ? ' playing' : ''}" data-bank="${p.bank}" data-btn="${esc(p.btn)}" data-playing="${p.playing ? 1 : 0}" data-count="${p.count}">${esc(label)}<small style="color:${p.playing ? '#fff' : 'var(--dim)'}">&nbsp;${p.bank}</small></span>`;
      }).join('');
    } else {
      sb.style.display = 'none';
    }

    const allUnresolved = s.channels.length > 0 && s.streamlabs.connected &&
      s.channels.every((c) => c.sources.every((x) => !x.resolved));
    const showOnb = s.profile.activeMappings.length === 0 || allUnresolved;
    $('#onboarding').style.display = showOnb ? 'block' : 'none';
    if (showOnb && !$('#onboarding').innerHTML) {
      $('#onboarding').innerHTML = `<h2>${T.onbTitle}</h2><ol>${T.onbSteps.map((x) => `<li>${esc(x)}</li>`).join('')}</ol>
        <div class="small">${T.onbDoc}<a href="https://github.com/Corail44/goxlr-streamlabs-sync#readme" target="_blank" rel="noopener">README</a></div>`;
      $('#settings-wrap').open = true;
    }

    renderProfileBits(s);
    renderLan(s);

    channelsList = s.channels_list || channelsList;
    if (!settingsInit) {
      settingsInit = true;
      initSettings(s);
    }
    $('#cfg-path').textContent = s.configFile ? T.cfgFile + s.configFile : '';

    if (!logsInit) {
      logsInit = true;
      $('#logs').innerHTML = '';
      for (const l of s.logs) addLog(l);
    }
  }

  function renderProfileBits(s) {
    const p = s.profile || {};
    if (p.active) {
      $('#profile-info').textContent =
        `${T.profileActive(p.active)} (${p.dedicated ? T.profileDedicated : T.profileDefault}). ${T.profileHint}`;
      const sp = $('#save-profile');
      sp.style.display = 'inline-block';
      sp.textContent = T.saveForProfile(p.active);
      const dp = $('#del-profile');
      dp.style.display = p.list.includes(p.active) ? 'inline-block' : 'none';
      dp.textContent = 'X ' + T.delForProfile(p.active);
    }
  }

  let lastQrUrl = null;
  function renderLan(s) {
    const lan = s.lan || {};
    $('#lan').checked = !!lan.enabled;
    $('#lan-urls').innerHTML = lan.enabled && lan.urls.length
      ? esc(T.lanOn) + lan.urls.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join(' · ')
      : esc(T.lanOff);

    // QR code for the best LAN URL (prefer the classic home subnets).
    const best = lan.enabled && lan.urls.length
      ? lan.urls.find((u) => /http:\/\/(192\.168\.|10\.0\.|10\.1\.)/.test(u)) ?? lan.urls[0]
      : null;
    $('#lan-qr-row').style.display = best && typeof qrcode === 'function' ? 'flex' : 'none';
    if (best && typeof qrcode === 'function' && best !== lastQrUrl) {
      lastQrUrl = best;
      try {
        const qr = qrcode(0, 'M');
        qr.addData(best);
        qr.make();
        $('#lan-qr').innerHTML = qr.createSvgTag({ cellSize: 5, margin: 0, scalable: true });
        $('#lan-qr').firstChild.style.width = '170px';
        $('#lan-qr').firstChild.style.height = '170px';
        $('#lan-qr-url').textContent = best;
      } catch {
        $('#lan-qr-row').style.display = 'none';
      }
    }
  }

  // --- Settings panel -------------------------------------------------------
  function mapRow(channel, source) {
    const row = document.createElement('div');
    row.className = 'map-row';
    const sel = document.createElement('select');
    for (const ch of channelsList) {
      const o = document.createElement('option');
      o.value = ch;
      o.textContent = ch;
      if (ch === channel) o.selected = true;
      sel.appendChild(o);
    }
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.setAttribute('list', 'sources-list');
    inp.placeholder = 'Streamlabs source...';
    inp.value = source || '';
    const del = document.createElement('button');
    del.className = 'x';
    del.textContent = 'X';
    del.onclick = () => row.remove();
    row.append(sel, inp, del);
    return row;
  }

  async function refreshSources() {
    try {
      const r = await fetch('/api/sources').then((x) => x.json());
      $('#sources-list').innerHTML = (r.sources || []).map((n) => `<option value="${esc(n)}">`).join('');
    } catch {}
  }

  function ruleRow(scene, snapshot) {
    const row = document.createElement('div');
    row.className = 'rule-row';
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.setAttribute('list', 'scenes-list');
    inp.placeholder = T.scenePh;
    inp.value = scene || '';
    const sel = document.createElement('select');
    for (const n of lastState?.snapshots ?? []) {
      const o = document.createElement('option');
      o.value = n;
      o.textContent = n;
      if (n === snapshot) o.selected = true;
      sel.appendChild(o);
    }
    const del = document.createElement('button');
    del.className = 'x';
    del.textContent = 'X';
    del.onclick = () => row.remove();
    row.append(inp, sel, del);
    return row;
  }

  async function refreshScenes() {
    try {
      const r = await fetch('/api/scenes').then((x) => x.json());
      $('#scenes-list').innerHTML = (r.scenes || []).map((n) => `<option value="${esc(n)}">`).join('');
    } catch {}
  }

  function initSettings(s) {
    const mm = $('#mutemode');
    mm.innerHTML = '';
    for (const mode of ['follow_stream', 'any', 'off']) {
      const o = document.createElement('option');
      o.value = mode;
      o.textContent = T.muteModes[mode];
      if (mode === s.settings.muteMode) o.selected = true;
      mm.appendChild(o);
    }
    $('#token').placeholder = s.settings.hasToken ? T.tokenSet : T.tokenUnset;
    $('#slobs-host').value = s.settings.slobsHost || '127.0.0.1';
    $('#slobs-port').value = s.settings.slobsPort || 59650;
    $('#twoway').checked = s.settings.twoWay !== false;
    $('#notif').checked = s.settings.notifications !== false;
    const rows = $('#map-rows');
    rows.innerHTML = '';
    for (const m of s.profile.activeMappings) rows.appendChild(mapRow(m.channel, m.source));
    refreshSources();

    $('#pin').placeholder = s.settings.hasPin ? T.pinSet : T.pinUnset;
    const rr = $('#rule-rows');
    rr.innerHTML = '';
    for (const [scene, rule] of Object.entries(s.settings.sceneRules ?? {})) {
      rr.appendChild(ruleRow(scene, rule.snapshot));
    }
    refreshScenes();

    fetch('/api/autostart').then((x) => x.json()).then((a) => {
      $('#autostart').checked = !!a.enabled;
    }).catch(() => {});
  }

  $('#rule-add').addEventListener('click', () => {
    $('#rule-rows').appendChild(ruleRow('', ''));
    refreshScenes();
  });

  function collectBody(extra = {}) {
    const mappings = [...document.querySelectorAll('#map-rows .map-row')]
      .map((row) => ({ channel: row.querySelector('select').value, source: row.querySelector('input').value.trim() }))
      .filter((m) => m.source);
    const sceneRules = {};
    for (const row of document.querySelectorAll('#rule-rows .rule-row')) {
      const scene = row.querySelector('input').value.trim();
      const snapshot = row.querySelector('select').value;
      if (scene && snapshot) sceneRules[scene] = { snapshot };
    }
    const body = {
      mappings,
      muteMode: $('#mutemode').value,
      twoWay: $('#twoway').checked,
      notifications: $('#notif').checked,
      lanAccess: $('#lan').checked,
      slobsHost: $('#slobs-host').value.trim(),
      slobsPort: $('#slobs-port').value.trim(),
      sceneRules,
      ...extra,
    };
    const tokenVal = $('#token').value.trim();
    if (tokenVal) body.token = tokenVal;
    const pinVal = $('#pin').value.trim();
    if (pinVal) body.pin = pinVal;
    return body;
  }

  async function postConfig(body) {
    const st = $('#save-status');
    st.style.color = 'var(--dim)';
    st.textContent = '...';
    try {
      const r = await fetch('/api/config', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then((x) => x.json());
      if (r.error) throw new Error(r.error);
      st.style.color = 'var(--led)';
      st.textContent = T.saved;
      if (body.token) {
        $('#token').value = '';
        $('#token').placeholder = T.tokenSet;
      }
      setTimeout(() => { st.textContent = ''; }, 4000);
      if (r.needsRestart && confirm(T.restartNow)) {
        await fetch('/api/restart', { method: 'POST' }).catch(() => {});
        quitRequested = true;
        showOverlay(T.restarting);
        setTimeout(() => location.reload(), 3500);
      }
    } catch (err) {
      st.style.color = 'var(--red)';
      st.textContent = err.message;
    }
  }

  $('#map-add').addEventListener('click', () => {
    $('#map-rows').appendChild(mapRow(channelsList[0] || 'Mic', ''));
    refreshSources();
  });

  $('#save').addEventListener('click', () => postConfig(collectBody()));
  $('#save-profile').addEventListener('click', () => {
    const active = lastState?.profile?.active;
    if (!active) return;
    const body = collectBody();
    body.profileSet = { name: active, mappings: body.mappings };
    delete body.mappings;
    postConfig(body);
  });
  $('#del-profile').addEventListener('click', () => {
    const active = lastState?.profile?.active;
    if (!active) return;
    postConfig({ profileDelete: active });
  });

  $('#autostart').addEventListener('change', async (e) => {
    const enabled = e.target.checked;
    try {
      const r = await fetch('/api/autostart', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ enabled }) }).then((x) => x.json());
      if (r.error) throw new Error(r.error);
      $('#autostart-info').textContent = r.warning || '';
    } catch (err) {
      $('#autostart-info').textContent = err.message;
      e.target.checked = !enabled;
    }
  });

  $('#token-test').addEventListener('click', async () => {
    const el = $('#token-result');
    el.style.color = 'var(--dim)';
    el.textContent = '...';
    try {
      const r = await fetch('/api/test-token', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          token: $('#token').value.trim(),
          host: $('#slobs-host').value.trim(),
          port: $('#slobs-port').value.trim(),
        }),
      }).then((x) => x.json());
      if (r.ok) {
        el.style.color = 'var(--led)';
        el.textContent = T.tokenOk;
      } else {
        el.style.color = 'var(--red)';
        el.textContent = r.error;
      }
    } catch (e) {
      el.style.color = 'var(--red)';
      el.textContent = e.message;
    }
  });

  $('#diag-copy').addEventListener('click', async () => {
    const el = $('#diag-status');
    try {
      const text = await fetch('/api/diagnostic').then((x) => x.text());
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      el.style.color = 'var(--led)';
      el.textContent = T.diagCopied;
      setTimeout(() => { el.textContent = ''; }, 5000);
    } catch (e) {
      el.style.color = 'var(--red)';
      el.textContent = e.message;
    }
  });

  // --- Mix editor ------------------------------------------------------------
  let editingMix = null;

  function openMixEditor(name) {
    const data = lastState?.snapshotData?.[name];
    if (!data) return;
    editingMix = name;
    $('#me-title').textContent = T.mixEditTitle(name);
    $('#me-status').textContent = '';
    const rows = $('#me-rows');
    rows.innerHTML = '';
    for (const c of lastState?.channels ?? []) {
      const ch = c.channel;
      const included = (data.volumes && ch in data.volumes) || (data.muted && ch in data.muted);
      const pct = data.volumes && ch in data.volumes
        ? Math.round(data.volumes[ch] / 255 * 100)
        : (c.volume == null ? 50 : Math.round(c.volume / 255 * 100));
      const mut = !!(data.muted && data.muted[ch]);
      const row = document.createElement('div');
      row.className = 'me-row';
      row.dataset.channel = ch;
      row.innerHTML = `
        <input type="checkbox" class="me-inc" title="${esc(T.mixInclude)}" ${included ? 'checked' : ''}>
        <span class="ch">${esc(ch)}</span>
        <input type="number" class="me-vol" min="0" max="100" step="1" value="${pct}">
        <span class="small" style="margin:0">%</span>
        <label class="small" style="margin:0; display:flex; align-items:center; gap:6px">
          <input type="checkbox" class="me-mut" ${mut ? 'checked' : ''}> ${esc(T.muted)}
        </label>`;
      rows.appendChild(row);
    }
    $('#mix-editor').style.display = 'block';
    $('#mix-editor').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  $('#me-close').addEventListener('click', () => {
    editingMix = null;
    $('#mix-editor').style.display = 'none';
  });

  $('#me-save').addEventListener('click', async () => {
    if (!editingMix) return;
    const volumes = {};
    const muted = {};
    for (const row of document.querySelectorAll('#me-rows .me-row')) {
      if (!row.querySelector('.me-inc').checked) continue;
      const ch = row.dataset.channel;
      const pct = Math.max(0, Math.min(100, parseInt(row.querySelector('.me-vol').value, 10) || 0));
      volumes[ch] = Math.round(pct * 255 / 100);
      muted[ch] = row.querySelector('.me-mut').checked;
    }
    const st = $('#me-status');
    st.style.color = 'var(--dim)';
    st.textContent = '...';
    try {
      const r = await fetch('/api/snapshot', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action: 'update', name: editingMix, volumes, muted }),
      }).then((x) => x.json());
      if (r.error) throw new Error(r.error);
      st.style.color = 'var(--led)';
      st.textContent = T.saved;
      setTimeout(() => { st.textContent = ''; }, 3000);
    } catch (err) {
      st.style.color = 'var(--red)';
      st.textContent = err.message;
    }
  });

  // --- FX and sampler bars ---------------------------------------------------
  $('#fxbar').addEventListener('click', (e) => {
    if (e.target.closest('#fx-toggle')) {
      const on = !!lastState?.fx?.enabled;
      fetch('/api/fx', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ enabled: !on }) }).catch(() => {});
      return;
    }
    const preset = e.target.closest('.fx-preset')?.dataset.preset;
    if (preset) {
      fetch('/api/fx', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ preset }) }).catch(() => {});
    }
  });

  $('#samplerbar').addEventListener('click', (e) => {
    const pad = e.target.closest('.pad');
    if (!pad) return;
    const playing = pad.dataset.playing === '1';
    const count = parseInt(pad.dataset.count, 10) || 1;
    const body = { bank: pad.dataset.bank, button: pad.dataset.btn };
    if (playing) body.stop = true;
    else body.index = Math.floor(Math.random() * count);
    fetch('/api/sample', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).catch(() => {});
  });

  // --- Mix snapshot chips ----------------------------------------------------
  $('#mixbar').addEventListener('click', async (e) => {
    const edit = e.target.closest('.edit');
    if (edit) {
      const name = edit.closest('.mix-chip')?.dataset.mix;
      if (name) openMixEditor(name);
      return;
    }
    const del = e.target.closest('.del');
    if (del) {
      const name = del.closest('.mix-chip')?.dataset.mix;
      if (name && confirm(T.mixDelete(name))) {
        await fetch('/api/snapshot', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'delete', name }) }).catch(() => {});
      }
      return;
    }
    if (e.target.closest('#mix-add')) {
      const name = prompt(T.mixName);
      if (name && name.trim()) {
        await fetch('/api/snapshot', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'save', name: name.trim() }) }).catch(() => {});
      }
      return;
    }
    const chip = e.target.closest('.mix-chip');
    const name = chip?.dataset.mix;
    if (name) {
      fetch('/api/snapshot', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'apply', name }) }).catch(() => {});
    }
  });

  // --- Touch faders: drag a strip track to set the GoXLR volume -------------
  let dragging = null;

  function volFromEvent(e) {
    const r = dragging.rect;
    const ratio = Math.min(1, Math.max(0, 1 - (e.clientY - r.top) / r.height));
    return Math.round(ratio * 255);
  }

  function postVolume(channel, volume) {
    fetch('/api/channel-volume', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ channel, volume }),
    }).catch(() => {});
  }

  function applyDrag(e) {
    if (!dragging) return;
    const v = volFromEvent(e);
    const pct = Math.round(v / 255 * 100);
    dragging.fill.style.height = pct + '%';
    dragging.val.innerHTML = pct + '<small>%</small>';
    dragging.lastV = v;
    const now = Date.now();
    if (now - dragging.lastSent >= 70) {
      dragging.lastSent = now;
      postVolume(dragging.channel, v);
    }
  }

  $('#console').addEventListener('pointerdown', (e) => {
    const track = e.target.closest('.s-track');
    if (!track) return;
    const strip = track.closest('.strip');
    const channel = strip?.dataset.channel;
    if (!channel) return;
    e.preventDefault();
    try { track.setPointerCapture(e.pointerId); } catch {}
    dragging = {
      channel,
      fill: track.querySelector('i'),
      val: strip.querySelector('.s-val'),
      rect: track.getBoundingClientRect(),
      lastSent: 0,
      lastV: null,
    };
    applyDrag(e);
  });
  $('#console').addEventListener('pointermove', (e) => {
    if (!dragging) return;
    e.preventDefault();
    applyDrag(e);
  });
  const endDrag = (e) => {
    if (!dragging) return;
    const v = e.clientY != null ? volFromEvent(e) : dragging.lastV;
    const channel = dragging.channel;
    dragging = null;
    if (v != null) postVolume(channel, v); // final value, untrottled
  };
  $('#console').addEventListener('pointerup', endDrag);
  $('#console').addEventListener('pointercancel', endDrag);

  // --- Strips / lifecycle ----------------------------------------------------
  $('#console').addEventListener('click', async (e) => {
    const btn = e.target.closest('.s-mute');
    if (!btn) return;
    const strip = btn.closest('.strip');
    const channel = strip?.dataset.channel;
    if (!channel) return;
    const muted = strip.dataset.muted === '1';
    try {
      await fetch('/api/channel-mute', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ channel, muted: !muted }),
      });
    } catch {}
  });

  function addLog(l) {
    const el = document.createElement('div');
    el.className = 'lg-' + l.level;
    el.textContent = `[${hhmmss(l.t)}] ${l.msg}`;
    const box = $('#logs');
    const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
    box.appendChild(el);
    while (box.childNodes.length > 300) box.removeChild(box.firstChild);
    if (stick) box.scrollTop = box.scrollHeight;
  }

  function showOverlay(msg) {
    $('#overlay-msg').textContent = msg;
    $('#overlay').classList.add('show');
  }

  $('#btn-settings').addEventListener('click', () => {
    const d = $('#settings-wrap');
    d.open = true;
    d.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  $('#quit').addEventListener('click', () => {
    const isLive = lastState?.live?.streaming === 'live' || lastState?.live?.recording === 'recording';
    if (!confirm(isLive ? T.confirmQuitLive : T.confirmQuit)) return;
    quitRequested = true;
    fetch('/api/quit', { method: 'POST' }).finally(() => showOverlay(T.stopped));
  });

  function startSSE() {
    const es = new EventSource('/api/events');
    es.addEventListener('state', (e) => {
      if (!quitRequested) $('#overlay').classList.remove('show');
      renderState(JSON.parse(e.data));
    });
    es.addEventListener('log', (e) => addLog(JSON.parse(e.data)));
    es.onerror = () => {
      if (!quitRequested) showOverlay(T.lost); // EventSource reconnects on its own
    };
  }

  async function submitPin() {
    const pin = $('#pin-input').value.trim();
    if (!pin) return;
    const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ pin }) }).catch(() => null);
    if (r && r.ok) location.reload();
    else {
      $('#pin-err').textContent = T.pinBad;
      $('#pin-input').value = '';
    }
  }
  $('#pin-go').addEventListener('click', submitPin);
  $('#pin-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitPin();
  });

  async function boot() {
    try {
      const r = await fetch('/api/state');
      if (r.status === 401) {
        $('#pin-gate').classList.add('show');
        $('#pin-input').focus();
        return;
      }
      if (r.ok) renderState(await r.json());
    } catch {}
    startSSE();
  }
  boot();
</script>
</body>
</html>
