name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test (module graph + CLI)
        run: |
          node src/index.js --help
          node src/index.js --version
      - name: Unit tests
        run: npm test

  # The exe build only runs on main: dev pushes stay fast and cheap.
  build-exe:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:exe
